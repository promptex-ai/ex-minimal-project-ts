# 發布入口：把一次發版的套件單元發布到 npm，alpha、beta、rc 與 GA 每個階段都發布。
#
# 發布的套件只有 plugins/ex-minimal-plugin-ts 與 adapters/ex-minimal-adapter-ts，兩者以
# linked-versions 同版。npm 以階段名作 dist-tag（alpha、beta、rc），GA 才是 latest，使用者要
# 明確指定才會裝到預發布版。判斷集中在 scripts/release/publish-units.sh：它依單元帶的檔案決定
# 註冊中心，只收 manifest 列出的兩個路徑，逐單元核對版號屬於這個階段，已在註冊中心的版號跳過。
#
# 由 release-please.yml 在單元 tag 建立後以 workflow_dispatch 派送，ref 是這次發版的單元 tag。
# 入口必須是本檔，不能由其他 workflow 以 workflow_call 呼叫：npm 的 Trusted Publisher 比對被觸發的
# workflow 檔名，被呼叫時比對到的是呼叫端。
#
# npm 走 Trusted Publishing（OIDC），不使用長期 token：短期憑證由 GitHub 的 OIDC 供應者於 job
# 執行時簽發，倉庫端不持有任何可外洩的長期密鑰，因此本檔沒有任何 secrets 引用，只有 id-token
# 權限。登記值為 owner promptex-ai、repo ex-minimal-project-ts、workflow publish.yml，environment
# 留空：本檔不宣告 environment。
#
# 本倉庫公開，所以發布帶 --provenance，把來源倉庫與 workflow 簽進 Sigstore 的公開透明日誌。
# Trusted Publishing 在公開倉庫本來就會自動產生 provenance；明寫旗標讓它成為必要條件，倉庫若轉為
# 私有，上傳會失敗而不是靜默少了 provenance。
name: Publish

on:
  workflow_dispatch:
    inputs:
      paths:
        description: '發版的套件路徑，JSON 陣列，例如 ["plugins/ex-minimal-plugin-ts"]'
        required: true
        type: string
      stage:
        description: 發布分支所在的階段；每個單元的版號都必須屬於這個階段
        required: true
        type: choice
        options: [alpha, beta, rc, ga]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# 同一個階段與同一組單元的重複派送排隊等候，不取消；publish-units.sh 會跳過已發布的版號。
concurrency:
  group: publish-${{ inputs.stage }}-${{ inputs.paths }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # npm 的 Trusted Publishing 只支援 GitHub 託管的 runner。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # OIDC 憑證簽發所需。
      id-token: write
      contents: read
    steps:
      # 本 job 持有 id-token: write，第三方與官方 action 一律釘 SHA。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm 的 Trusted Publishing 需要 npm 11.5.1 以上，Node 22 內建的是 10.x，Node 24 內建 11.x。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 發布到 npm
        env:
          PATHS: ${{ inputs.paths }}
          STAGE: ${{ inputs.stage }}
          PUBLISH_OUT: ${{ runner.temp }}/publish
        run: |
          echo "npm $(npm --version)"
          mapfile -t paths < <(jq -r '.[]' <<<"$PATHS")
          bash scripts/release/publish-units.sh "$STAGE" "${paths[@]}"
