name: release-line-finalize

# vX.Y.Z tag = release train closed. Verifies every unit tag, publishes the Snapshot as a
# GitHub Release, and checks the governance sync: the release PR reached main and every Issue
# scheduled for the release (label release:vX.Y.Z) is closed.
on:
  push:
    tags: ["v[0-9]*"]
  # Manual entry point so a finalize can be re-verified after a fix without re-tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: "product tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: read

defaults:
  run:
    shell: bash

concurrency:
  group: finalize-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  finalize:
    # This repository is public and the organization's self-hosted runner group is closed to public
    # repositories, so the job runs on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          restore-from-default: "scripts"

      - name: Snapshot with tag check
        id: snap
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ref="$TAG"
          v="${ref#v}"
          prev="$(git tag --list 'v[0-9]*' --sort=-v:refname | awk -v c="$ref" 'f{print;exit} $0==c{f=1}')"
          echo "comparing against ${prev:-（無前一個產品版）}"
          bash scripts/release/snapshot.sh --product "$v" --check-tags ${prev:+--since "$prev"} > snapshot.md
          cat snapshot.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q '✗ missing' snapshot.md; then echo "missing unit tags" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Product GitHub Release (notes = Snapshot)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.snap.outputs.version }}
        run: gh release create "$TAG" --title "Product v${VERSION}" --notes-file snapshot.md || echo "release exists"
      # 治理同步：這一版的 release PR 已合回 main，排入這一版（label release:vX.Y.Z）的 Issue 全部關閉。
      # GitHub 在 commit 進入預設分支後才非同步關閉 Issue，所以仍開著的 Issue 會重查幾次再判定。
      - name: Governance sync
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.snap.outputs.version }}
        run: |
          v="$VERSION"
          line="${v%.*}"
          fail=0
          {
            echo "### governance sync"
            pr="$(gh pr list --state merged --base main --head "release/v${line}--to-main" --limit 20 --json number,title \
              --jq ".[] | select(.title | contains(\"product v${v} \")) | \"#\\(.number) \\(.title)\"" | head -1)"
            if [ -n "$pr" ]; then echo "- ✓ release PR ${pr}"; else echo "- ✗ 找不到合回 main 的 release PR（head release/v${line}--to-main，標題含 product v${v}）"; fail=1; fi
            open=""
            for _ in 1 2 3 4 5 6; do
              open="$(gh issue list --label "release:v${v}" --state open --json number --jq '[.[].number | "#\(.)"] | join(", ")')"
              [ -z "$open" ] && break
              sleep 10
            done
            total="$(gh issue list --label "release:v${v}" --state all --limit 500 --json number --jq length)"
            if [ -z "$open" ]; then echo "- ✓ release:v${v} 的 Issue ${total} 個全部關閉"
            else echo "- ✗ release:v${v} 仍有 Issue 未關閉：${open}"; fail=1; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
